services:
    aminer:
        image: ghcr.io/ait-aecid/logdata-anomaly-miner_rest
        container_name: aminer
        volumes:
            - aminer-tmp:/tmp
            - ./demo-config.yml:/etc/aminer/config.yml:ro
            - ./testdata/aminer-run:/var/run:rw
            - ./testdata/aminer-rest-output.log:/tmp/aminer-rest/output.log:rw
            - ./testdata/aminer-rest-input.log:/tmp/syslog:ro
        networks:
            - aminer-net
        command: aminer -c /etc/aminer/config.yml
    aminer-rest:
        image: ghcr.io/ait-aecid/aminer-rest
        container_name: aminer-rest
        volumes:
            - aminer-tmp:/tmp
            - ./testdata/aminer-run:/var/run:rw
            - ./testdata/aminer-rest-output.log:/tmp/aminer-rest/output.log
        expose:
            - "8000"
        networks:
            - aminer-net
        depends_on:
            aminer:
                condition: service_started
        healthcheck:
            test: [ "CMD-SHELL", "python3 -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/openapi.json', timeout=5).close()\"" ]
            interval: 30s
            timeout: 20s
            retries: 10
            start_period: 5s
    client:
        image: ghcr.io/ait-aecid/aminer-rest
        container_name: client
        working_dir: /workspace
        volumes:
            - aminer-tmp:/tmp
            - .:/workspace:ro
            - ./output/client-results:/results:rw
            - ./testdata/aminer-run:/var/run:rw
            - ./testdata/aminer-rest-output.log:/tmp/aminer-rest/output.log:rw
        networks:
            - aminer-net
        environment:
            - RESULTS_DIR=/results
            - REMOTE_SOCKET=/var/run/aminer-remote.socket
        depends_on:
            aminer:
                condition: service_started
            aminer-rest:
                condition: service_healthy
        entrypoint: ["python3"]
        command: ["scripts/run_remote_control_api_tests.py"]

volumes:
    aminer-source:
    aminer-tmp:
networks:
    aminer-net:
